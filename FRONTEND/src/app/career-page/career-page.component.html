<div style="background-image: url('../../assets/images/mujer-competencia-chaquinan-6k.jpg'); background-size: cover; height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center;">
  <!-- Encabezado -->
  <header style="position: absolute; top: 20px; left: 20px;">
    <img src="../../assets/images/Logo-bancovertical.png" alt="Logo" height="50">
  </header>

  <!-- Contenido principal -->
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <form [formGroup]="miFormulario" (ngSubmit)="enviarDatos()">
      <!-- Campo Nombre -->
      <div>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" formControlName="nombre" required class="form-control" placeholder="Ingrese su nombre">
      </div>

      <!-- Campo Correo -->
      <div>
        <label for="correo">Correo:</label>
        <input type="email" id="correo" formControlName="correo" required class="form-control" placeholder="Ingrese su correo">
      </div>
      <br>
      <!-- Botón de enviar -->
      <div>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer style="position: absolute; bottom: 20px;">
    <img src="../../assets/images/logo-6k-chaquinan-02.png" alt="Logo 1" height="50" style="margin-right: 10px;">
    <img src="../../assets/images/logo-6k-chaquinan.png" alt="Logo 2" height="50" style="margin-right: 10px;">
    <img src="../../assets/images/logo-el-banco-aleman-ecuador.png" alt="Logo 3" height="50">
  </footer>

</div>
