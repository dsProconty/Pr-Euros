<div class="login-page">

  <div class="login-card">

    <!-- Acento superior -->
    <div class="login-accent"></div>

    <div class="login-body">
      <!-- Logo -->
      <div class="login-logo-wrap">
        <img src="../../assets/images/Logo-bancovertical.png" alt="Banco ProCredit" class="login-logo">
      </div>

      <!-- Títulos -->
      <h2 class="login-title">Ingreso de administración</h2>
      <p class="login-subtitle">Inicia sesión para gestionar las tasas del simulador.</p>

      <!-- Formulario -->
      <form (ngSubmit)="submit()" autocomplete="on">

        <!-- Email -->
        <div class="campo-grupo">
          <label class="campo-label" for="loginEmail">Correo electrónico</label>
          <div class="campo-input-wrap">
            <span class="campo-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input
              id="loginEmail"
              class="campo-input"
              type="email"
              placeholder="usuario@banco.com"
              [(ngModel)]="email"
              name="email"
              autocomplete="username"
              [disabled]="isLoading">
          </div>
        </div>

        <!-- Contraseña -->
        <div class="campo-grupo">
          <label class="campo-label" for="loginPassword">Contraseña</label>
          <div class="campo-input-wrap">
            <span class="campo-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              id="loginPassword"
              class="campo-input"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Contraseña"
              [(ngModel)]="password"
              name="password"
              autocomplete="current-password"
              [disabled]="isLoading">
            <button type="button" class="campo-ojo" (click)="showPassword = !showPassword" tabindex="-1"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <!-- Ojo abierto -->
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Ojo tachado -->
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Botón -->
        <button class="btn-login" type="submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Iniciar sesión</span>
          <span *ngIf="isLoading" class="btn-login-loading">
            <span class="spinner"></span>
            Ingresando…
          </span>
        </button>

      </form>
    </div>

  </div>

</div>
